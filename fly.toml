# Fly.io example (edit "app" and "primary_region"). Create the volume first:
#   fly volumes create quartet_data --size 1 --region vie
app = "quartet-events"
primary_region = "vie"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "sqlite:/data/quartet.db"
  PORT = "3000"

[[mounts]]
  source = "quartet_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep running so the scheduler and leases work
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
